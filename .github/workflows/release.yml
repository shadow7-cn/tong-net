name: Release desktop apps

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            platform: windows-latest
            args: --bundles nsis
            rust-targets: ""
          - name: macOS Apple Silicon
            platform: macos-latest
            args: --target aarch64-apple-darwin --bundles dmg
            rust-targets: aarch64-apple-darwin
          - name: macOS Intel
            platform: macos-latest
            args: --target x86_64-apple-darwin --bundles dmg
            rust-targets: x86_64-apple-darwin

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Prepare bundled EasyTier Core
        run: npm run prepare:easytier

      - name: Verify release tag
        shell: bash
        run: |
          VERSION=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match app version v${VERSION}."
            exit 1
          fi

      - name: Build and upload desktop bundle
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: v__VERSION__
          releaseName: 同网互通 v__VERSION__
          releaseBody: |
            请根据操作系统下载对应安装包。

            Windows 用户可选择安装版 setup.exe，或下载 portable.zip 解压后直接运行。
            首次启用虚拟局域网时，系统会请求管理员权限安装 EasyTier 后台服务；安装完成后，连接和断开不再重复授权。
            当前版本尚未进行商业代码签名，系统可能显示未知发布者或安全提醒。
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: true
          args: ${{ matrix.args }}
          releaseAssetNamePattern: tong-net_[version]_[platform]_[arch][setup].[ext]

      - name: Create Windows portable ZIP
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $version = (Get-Content "apps/desktop/src-tauri/tauri.conf.json" | ConvertFrom-Json).version
          $folderName = "tong-net_${version}_windows_x64_portable"
          $folder = Join-Path "portable" $folderName
          New-Item -ItemType Directory -Force -Path $folder | Out-Null
          Copy-Item "apps/desktop/src-tauri/target/release/tong-net-desktop.exe" (Join-Path $folder "同网互通.exe")
          Copy-Item "LICENSE" (Join-Path $folder "LICENSE")
          @"
          同网互通 v$version Windows x64 便携版

          1. 解压整个 ZIP 后运行“同网互通.exe”。
          2. 请勿直接在压缩包预览界面中运行。
          3. 程序依赖 Microsoft Edge WebView2 Runtime；Windows 10/11 通常已自带。
          4. 当前版本未进行商业代码签名，Windows 可能显示未知发布者提示。
          5. 请仅在可信局域网中开启无令牌访问。
          6. 首次启用虚拟局域网时，Windows 会请求管理员权限安装 EasyTier 后台服务。
          "@ | Set-Content -Encoding utf8 (Join-Path $folder "README.txt")
          $zip = "portable/$folderName.zip"
          Compress-Archive -Path "$folder/*" -DestinationPath $zip -CompressionLevel Optimal
          "PORTABLE_ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload Windows portable ZIP
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload $env:GITHUB_REF_NAME $env:PORTABLE_ZIP --clobber
